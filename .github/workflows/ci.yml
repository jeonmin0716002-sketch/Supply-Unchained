# 기본 CI — 모든 push/PR 에서 lint + 테스트
# 액션은 커밋 SHA 로 고정한다 — 태그(@v4)는 언제든 다른 커밋을 가리키게 바뀔 수 있고,
# 그 순간 우리 CI 러너 안에서 남의 코드가 조용히 갈린다. 이 프로젝트가 막겠다는 공격이
# 정확히 그 모양이라 자기 파이프라인부터 지킨다. 옆의 주석이 사람이 읽는 버전 표시다.
# 갱신: gh api repos/<owner>/<repo>/git/ref/tags/<tag> 로 SHA 를 다시 뽑아 바꾼다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Self-scan (bandit)
        # 스캐너가 정작 자기 코드는 bandit 으로 안 보고 있었다. 의존성으로는 이미 들어와
        # 있으니 게이트만 붙인다.
        #   -ll : MEDIUM 이상만 실패로 삼는다. LOW(B101 assert, B404 subprocess import
        #         등)까지 올리면 의도된 코드마다 #nosec 을 달게 되고, 그러면 진짜 신규
        #         findings 가 억제 주석 더미에 묻힌다.
        #   대상: samples/ 는 일부러 악성처럼 쓴 코드라 뺀다 (pyproject 의 ruff exclude 와 같은 이유).
        run: uv run bandit -q -r api cli common engine scoring -ll

      - name: Tests
        run: uv run pytest -q
